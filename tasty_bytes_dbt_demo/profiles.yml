# replace all references to "tasty_bytes_dbt_db" with "dbt_projects"
# replace all references to "tasty_bytes_dbt_wh" with "dbt_projects_wh"

tasty_bytes:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: 'not needed'
      user: 'not needed'
      role: accountadmin
      database: dbt_projects
      schema: dev
      warehouse: dbt_projects_wh
      threads: 8
    prod:
      type: snowflake
      account: 'not needed'
      user: 'not needed'
      role: accountadmin
      database: dbt_projects
      schema: prod
      warehouse: dbt_projects_wh
      threads: 8
